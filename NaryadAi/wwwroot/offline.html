<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#5146e5">
    <title>НарядAI — нет подключения</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f5f7fb; color: #1d2939; }
        main { width: min(30rem, calc(100% - 2rem)); padding: 2rem; border-radius: 1rem; background: white; box-shadow: 0 8px 32px #10182818; text-align: center; }
        h1 { margin-top: 0; color: #5146e5; }
        p { line-height: 1.6; }
        button { min-height: 3.5rem; width: 100%; margin-top: 1rem; border: 0; border-radius: .75rem; background: #5146e5; color: white; font: inherit; font-weight: 700; }
    </style>
</head>
<body>
    <main>
        <h1>НарядAI</h1>
        <p>Нет подключения к сети. Для безопасной работы с нарядами подключитесь к интернету и обновите страницу.</p>
        <button type="button" onclick="location.reload()">ПОВТОРИТЬ ПОДКЛЮЧЕНИЕ</button>
    </main>
</body>
</html>
